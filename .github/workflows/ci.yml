name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]

    steps:
      - uses: actions/checkout@v5

      - uses: echolang/setup-echo@v1

      # the ecotest runner on every OS. coverage is not measured on Windows, so the line gate
      # holds on the other two
      - name: Test
        run: |
          epm install
          epm run ecotest --style simple ${{ runner.os != 'Windows' && '--coverage --min-coverage 100' || '' }}
