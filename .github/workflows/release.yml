name: release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    uses: echolang/setup-echo/.github/workflows/release.yml@v1
    with:
      changelog: false
      target-branch: ${{ github.event.workflow_run.head_branch }}
